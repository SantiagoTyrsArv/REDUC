[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-reduc"
version = "0.1.0"
description = "Rutas accesibles para personas en silla de ruedas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23,<26",
  "boto3>=1.35,<2",
  "dramatiq[redis]>=1.17,<3",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.16,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "osmium>=4,<5",
  "pillow>=11,<13",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pyproj>=3.7,<4",
  "python-multipart>=0.0.20,<1",
  "rasterio>=1.4,<2",
  "redis>=5.2,<8",
  "shapely>=2,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "testcontainers[postgres]>=4.10,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reduc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers --cov=reduc --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/reduc/core"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
