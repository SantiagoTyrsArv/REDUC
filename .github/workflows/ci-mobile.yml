name: Mobile CI

on:
  push:
    paths:
      - mobile/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ci-mobile.yml
  pull_request:
    paths:
      - mobile/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ci-mobile.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reduc/mobile --if-present lint
      - run: pnpm --filter @reduc/mobile --if-present test
