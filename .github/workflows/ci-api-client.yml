name: API client CI

# Fails when packages/api-client is out of date with the backend OpenAPI schema (T-11).
on:
  push:
    paths:
      - backend/src/reduc/api/**
      - backend/scripts/export_openapi.py
      - packages/api-client/**
      - pnpm-lock.yaml
      - .github/workflows/ci-api-client.yml
  pull_request:
    paths:
      - backend/src/reduc/api/**
      - backend/scripts/export_openapi.py
      - packages/api-client/**
      - pnpm-lock.yaml
      - .github/workflows/ci-api-client.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --directory backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reduc/api-client lint
      - run: pnpm --filter @reduc/api-client check
